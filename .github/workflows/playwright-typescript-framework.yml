name: Playwright TypeScript Framework

on:
  push:
    branches: [main]
    paths:
      - 'playwright-typescript-framework/**'
      - '.github/workflows/playwright-typescript-framework.yml'
  pull_request:
    paths:
      - 'playwright-typescript-framework/**'
      - '.github/workflows/playwright-typescript-framework.yml'
  workflow_dispatch:
    inputs:
      workers:
        description: "Số luồng song song cho mỗi trình duyệt"
        required: false
        default: "5"

# Push mới lên cùng nhánh/PR thì huỷ lượt chạy cũ đang dở
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Số luồng song song CHO MỖI TRÌNH DUYỆT — sửa đúng dòng này, KHÔNG đụng playwright.config.ts.
  # Các trình duyệt chạy LẦN LƯỢT (Chrome → Edge → Firefox), không chạy cùng lúc.
  # Runner GitHub mặc định 2 vCPU: nếu test chập chờn thì hạ xuống 2–3 ở đây.
  WORKERS: ${{ github.event.inputs.workers || 5 }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: playwright-typescript-framework
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: playwright-typescript-framework/package-lock.json

      # CLI Allure 2 (allure-commandline trong devDependencies) chạy trên Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      # Firefox + ffmpeg vào .browsers/ · Runner Linux không có sẵn Chrome/Edge → Playwright cài bản chính thức lên runner
      - run: npm run browsers:install -- --with-deps chrome msedge
      - run: npm run typecheck

      - name: Run tests — UI lần lượt Chrome → Edge → Firefox (mỗi trình duyệt WORKERS luồng), rồi crm, api
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://book.anhtester.com' }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          CRM_ADMIN_EMAIL: ${{ secrets.CRM_ADMIN_EMAIL }}
          CRM_ADMIN_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
          CRM_PM_EMAIL: ${{ secrets.CRM_PM_EMAIL }}
          CRM_PM_PASSWORD: ${{ secrets.CRM_PM_PASSWORD }}
          # Tuỳ chọn — để trống thì test tương ứng tự skip
          CRM_CUSTOMER_EMAIL: ${{ secrets.CRM_CUSTOMER_EMAIL }}
          CRM_CUSTOMER_PASSWORD: ${{ secrets.CRM_CUSTOMER_PASSWORD }}
          CRM_TC014_EMAIL: ${{ secrets.CRM_TC014_EMAIL }}
          CRM_TC014_PASSWORD: ${{ secrets.CRM_TC014_PASSWORD }}
          HEADLESS: 'true'
        # Chưa khai đủ tài khoản → chỉ chạy test công khai (bỏ @auth) thay vì đỏ cả suite.
        # Test @knownbug (bug app đã báo cáo) KHÔNG quyết định xanh/đỏ ở đây — chạy riêng ở bước sau.
        run: |
          if [ -n "$TEST_EMAIL" ] && [ -n "$TEST_PASSWORD" ] && [ -n "$CRM_ADMIN_EMAIL" ] && [ -n "$CRM_ADMIN_PASSWORD" ] && [ -n "$CRM_PM_EMAIL" ] && [ -n "$CRM_PM_PASSWORD" ]; then
            node scripts/run-browsers.mjs --all --grep-invert "@knownbug"
          else
            echo "::warning::Chưa khai đủ secrets TEST_* / CRM_* — chỉ chạy test công khai, bỏ qua test @auth"
            node scripts/run-browsers.mjs --all --grep-invert "@auth|@knownbug"
          fi

      # Bug app đang mở (docs/bugs/) — vẫn chạy, vẫn hiện FAIL trong Allure report, nhưng không làm đỏ pipeline.
      # Bug được fix thì test chuyển xanh → gỡ tag @knownbug để nó quay lại nhóm chặn.
      - name: Run tests @knownbug (không chặn pipeline)
        if: always()
        continue-on-error: true
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://book.anhtester.com' }}
          CRM_ADMIN_EMAIL: ${{ secrets.CRM_ADMIN_EMAIL }}
          CRM_ADMIN_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
          CRM_PM_EMAIL: ${{ secrets.CRM_PM_EMAIL }}
          CRM_PM_PASSWORD: ${{ secrets.CRM_PM_PASSWORD }}
          HEADLESS: 'true'
          KEEP_ALLURE_RESULTS: '1'
          PLAYWRIGHT_HTML_REPORT: reports/html/knownbug
        run: |
          if [ -n "$CRM_ADMIN_PASSWORD" ] && [ -n "$CRM_PM_PASSWORD" ]; then
            npx playwright test --project=crm --project=api --grep "@knownbug"
          else
            npx playwright test --project=crm --project=api --grep "@knownbug" --grep-invert "@auth"
          fi

      # Lấy history của report đang public trên GitHub Pages → biểu đồ Trend nối tiếp giữa các lần chạy
      - name: Tải history Allure từ GitHub Pages
        if: always()
        continue-on-error: true
        run: |
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history"
          mkdir -p reports/allure-report/history
          for f in history.json history-trend.json categories-trend.json duration-trend.json retry-trend.json; do
            curl -sf "$base/$f" -o "reports/allure-report/history/$f" || rm -f "reports/allure-report/history/$f"
          done

      - name: Sinh Allure report
        if: always()
        run: npm run report:generate && npm run report:single

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: playwright-typescript-framework/reports/
          retention-days: 14

      # Chỉ public report của nhánh main / chạy tay — PR không ghi đè trang đang xem
      - name: Đóng gói Allure report cho GitHub Pages
        if: always() && github.event_name != 'pull_request' && hashFiles('playwright-typescript-framework/reports/allure-report/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-typescript-framework/reports/allure-report

  # Xem report tại https://<owner>.github.io/<repo>/
  # Cần bật 1 lần: Settings → Pages → Build and deployment → Source = GitHub Actions
  publish-report:
    needs: test
    if: always() && github.event_name != 'pull_request' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
